<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>解法复盘-桥式颜色转换工具</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1> 解法复盘-桥式颜色转换工具</h1>

    <label>
      左桥色：
      <select id="pColor">
        <option value="白">白</option>
        <option value="黄">黄</option>
        <option value="绿">绿</option>
        <option value="蓝" selected>蓝</option>
        <option value="橙">橙</option>
        <option value="红">红</option>
      </select>
    </label>

    <label>
      桥底色：
      <select id="qColor">
        <option value="白" selected>白</option>
        <option value="黄">黄</option>
        <option value="绿">绿</option>
        <option value="蓝">蓝</option>
        <option value="橙">橙</option>
        <option value="红">红</option>
      </select>
    </label>

    <label>
      alg.cubing.net 链接：
      示例：https://alg.cubing.net/?setup=D_B2_U2_F2_R2_D_R2_B2_L2_F-_U-_R_U-_L-_B2_F2_D_B2_R&alg=x_y-_%2F%2F_inspection%0AD-_R_u-_R_R_U_r_r_F-_%2F%2F_FB%0AU-_R_R_U-_U-_R_U_R-_%2F%2F_SS%0AU-_M_r-_U-_r_%2F%2F_SP%0AU-_U-_M-_U-_M-_U-_U_M-_U-_U-_M-_U_%2F%2F_EOLRb%0AM-_U-_U-_M-_M-_U-_U-_M-_%2F%2F_EP
      <textarea id="urlInput" rows="7" placeholder="粘贴 alg.cubing.net 链接"></textarea>
    </label>

    <button id="runButton">执行</button>

    <section id="resultSection" class="hidden">
      <h2>输出链接</h2>
      <textarea id="urlOutput" rows="7" readonly></textarea>

      <div class="buttons">
        <button id="copyButton">复制链接</button>
        <button id="openButton">打开链接</button>
      </div>
    </section>

    <p id="message"></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
