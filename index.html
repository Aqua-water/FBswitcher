<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>解法复盘-桥式颜色转换工具</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1> 解法复盘-桥式颜色转换工具</h1>
    <h2>在线转换</h2>
    <div class="image-wrapper">
      <img
        id="bridgeImage"
        src="./image/image1.png"
        alt="FBswitcher 示意图"
        class="top-image"
      />
    </div>
    <label>
      左桥色：
      <select id="FBColor">
        <option value="白">白</option>
        <option value="黄">黄</option>
        <option value="绿">绿</option>
        <option value="蓝" selected>蓝</option>
        <option value="橙">橙</option>
        <option value="红">红</option>
      </select>
    </label>

    <label>
      桥底色：
      <select id="DColor">
        <option value="白" selected>白</option>
        <option value="黄">黄</option>
        <option value="绿">绿</option>
        <option value="蓝">蓝</option>
        <option value="橙">橙</option>
        <option value="红">红</option>
      </select>
    </label>

    <label>
      alg.cubing.net 链接：
      <textarea id="urlInput" rows="7" placeholder="粘贴复盘链接。示例：https://alg.cubing.net/?setup=D-_F-_L2_D2_F2_B_R2_F2_U2_R2_F_U2_L2_D2_F-_L2_U2&alg=y_x-_%2F%2F_inspection%0Ar_B2_R_%2F%2F_F2B%0AU_M_U2_M2-_U2_M-_%2F%2F_EP"></textarea>
    </label>

    <button id="runButton">执行</button>

    <section id="resultSection" class="hidden">
      <h2>输出链接</h2>
      <textarea id="urlOutput" rows="7" readonly></textarea>

      <div class="buttons">
        <button id="copyButton">复制链接</button>
        <button id="openButton">打开链接</button>
      </div>
    </section>

    <section class="bookmarklet-section">
      <h2>书签工具</h2>
    
      <p>
        电脑端可以手动添加一个书签，在 alg.cubing.net 页面直接转换。
      </p>
    
      <button id="copyBookmarkletButton" type="button">
        复制链接
      </button>
    
      <p class="hint">
        点击复制链接后，在浏览器收藏夹中新建书签，编辑书签网址为复制的内容。
        之后打开 alg.cubing.net 页面，再点击该书签，即可直接转换为指定的桥色。
      </p>
    
    </section>

    <p id="message"></p>
  </main>

  <script src="./solver.js"></script>
  <script src="./app.js"></script>
</body>
</html>
